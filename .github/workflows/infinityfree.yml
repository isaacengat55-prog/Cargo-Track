name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Upload website over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          server-dir: /cargotrack.free.je/htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/config.local.php
            **/config.local.example.php
            **/createAdmin.php
            **/create_admin.php
            **/README.md
            **/schema.sql
